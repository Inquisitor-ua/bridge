# Builds the Docker image on GitHub (the prod server is too weak to run the
# frontend build itself) and publishes it to GHCR. The server then only
# pulls it: docker compose pull && docker compose up -d
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/inquisitor-ua/bridge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
